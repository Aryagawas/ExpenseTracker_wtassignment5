```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Expense Tracker</h1>

  <section class="summary">
    <p>Total: <strong id="total">₹0.00</strong></p>
    <p>Number of Expenses: <strong id="count">0</strong></p>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add Expense</h2>

    <form id="expenseForm">
      <label for="title">Title</label>
      <input id="title" type="text" maxlength="100"
             placeholder="e.g. Lunch" required>

      <label for="amount">Amount (₹)</label>
      <input id="amount" type="number" min="0.01" step="0.01"
             placeholder="e.g. 250" required>

      <label for="category">Category</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Education</option>
        <option>Bills</option>
        <option>Other</option>
      </select>

      <label for="date">Date</label>
      <input id="date" type="date" required>

      <button type="submit" id="submitButton">Add Expense</button>
      <button type="button" id="cancelButton" hidden>Cancel</button>
    </form>

    <p id="message" role="status"></p>
  </section>

  <section class="panel">
    <h2>All Expenses</h2>

    <div class="filters">
      <input id="search" type="search" placeholder="Search by title">

      <select id="filterCategory">
        <option value="">All categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Education</option>
        <option>Bills</option>
        <option>Other</option>
      </select>

      <button type="button" id="refreshButton">Refresh</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>
  </section>
</body>
</html>
```
